name: App Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "www/horario.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Armar la página
        run: npm run build
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Permisos de avisos
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application|' $M
          grep -n "permission" $M
      - name: Firma fija para poder actualizar la app
        run: |
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../rutina.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Rutina ${{ github.run_number }}
          make_latest: true
          files: rutina.apk
          body: "Descarga rutina.apk desde el celular e instálala encima de la anterior."
